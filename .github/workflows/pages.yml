name: 牛客岗位更新及看板部署

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'

permissions:
  contents: read

concurrency:
  group: nowcoder-pages
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 刷新公开 JD
        if: github.event_name != 'push'
        run: node refresh.mjs
        env:
          MATCH_PROFILE_JSON: ${{ secrets.MATCH_PROFILE_JSON }}
      - name: 提交岗位 JSON
        if: github.event_name != 'push'
        shell: bash
        run: |
          git add -- jobs.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Nowcoder jobs'
          git push origin HEAD:main
      - name: 准备静态页面
        run: |
          mkdir -p _site
          cp index.html jobs.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
